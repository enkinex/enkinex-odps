name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  KCL_VERSION: "0.12.8"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install KCL
        run: curl -fsSL https://kcl-lang.io/script/install-cli.sh | bash -s -- -v "${KCL_VERSION}"

      - uses: extractions/setup-just@v2

      - name: kcl mod update
        run: just init

      # `just check`, not `just test`: the recipe formats, proves the tree is
      # unchanged by it, lints, then tests. CI used to call only the last step,
      # so fmt and lint were ungated here — which is how 53 unformatted files
      # reached main in enkinex-odcs without a single red check (AIOPS-16).
      - name: Run checks
        run: just check
