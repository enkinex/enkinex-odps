# Test for the `product.input` module: InputPort, including the
# TagsDiscoverable tail (tags, customProperties, authoritativeDefinitions).
# InputContract is exercised from the output port, its only consumer:
# see odps.module.product-output.yaml.
apiVersion: v1.0.0
kind: DataProduct
id: d47a1e10-0003-4c00-8000-0000000000d3
name: Product Input Module Test
version: 1.0.0
status: active

inputPorts:
  # Minimal input port: only the three mandatory fields
  - name: minimal-input
    version: 1.0.0
    contractId: aaaaaaaa-0000-4000-8000-000000000001

  # Complete input port: every optional block populated
  - name: full-input
    version: 2.1.0
    contractId: aaaaaaaa-0000-4000-8000-000000000002
    tags: ["input", "kafka", "streaming"]
    customProperties:
      - property: partitionCount
        value: 12
      - property: retentionDays
        value: 7
      - property: compacted
        value: true
    authoritativeDefinitions:
      - type: businessDefinition
        url: "https://glossary.enkinex.example/input-port"
      - type: implementation
        url: "https://git.enkinex.example/repo/input-port-impl"
        description: "Kafka topic implementation"
